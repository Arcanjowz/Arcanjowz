name: Generate Terminal GIF

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg and Library
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install github-readme-terminal

      - name: Run Script & Generate GIF
        run: python main.py

      - name: Commit & Push GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.gif
          git commit -m "chore: update terminal output.gif" || echo "Sem mudanças"
          git push
