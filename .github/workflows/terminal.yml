name: Generate Terminal GIF

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: Arch
    steps:
      - uses: actions/checkout@v4
      - name: Generate GIF
        uses: x0rzavi/github-readme-terminal@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.gif
          git commit -m "Update retro terminal GIF" || echo "Sem mudanças"
          git push
