name: Shell GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shell_gen.py
      - config/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar gifos
        run: |
          git clone --depth 1 https://github.com/x0rzavi/github-readme-terminal.git /tmp/gifos
          pip install /tmp/gifos

      - name: Configurar cores
        run: |
          mkdir -p ~/.config/gifos
          cp config/*.toml ~/.config/gifos/

      - name: Gerar GIF
        run: python3 shell_gen.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.gif
          git diff --cached --quiet || git commit -m "chore: atualiza output.gif"
          git push
